<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northfield Capital Finance — Loan Management</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --border:#dfe3e8; --border-strong:#c7ccd3;
  --ink:#1f2530; --muted:#6b7280; --navy:#1c3d5a; --navy-ink:#123049;
  --green:#1f7a4d; --amber:#9a6a12; --red:#b3261e; --greenbg:#eaf5ef; --amberbg:#fbf1e0; --redbg:#fbeaea;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;}
a{color:var(--navy);text-decoration:none;}
header{position:sticky;top:0;z-index:30;background:var(--navy);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--navy-ink);}
.hbar{display:flex;align-items:center;gap:18px;padding:12px 20px;color:#eef2f6;}
.hbar .logo{font-weight:700;font-size:15px;letter-spacing:.01em;}
.hbar .logo span{color:#c9d6e2;font-weight:400;}
.hbar .who{margin-left:auto;font-size:12px;color:#cdd7e1;display:flex;gap:10px;align-items:center;}
.hbar select{background:#254e70;color:#fff;border:1px solid #33608a;border-radius:4px;padding:5px 8px;font-size:12px;}
nav{display:flex;gap:2px;background:#f0f2f5;border-bottom:1px solid var(--border);padding:0 16px;overflow-x:auto;}
nav button{background:none;border:none;padding:11px 14px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font:inherit;}
nav button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600;}
main{max-width:1120px;margin:0 auto;padding:22px 20px 70px;}
h1{font-size:19px;margin:0 0 4px;font-weight:600;}
h2{font-size:14px;margin:0 0 12px;font-weight:600;color:#33404e;}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 18px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px 18px;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:760px){.grid,.grid3,.grid4{grid-template-columns:1fr 1fr;}}
@media(max-width:480px){.grid,.grid3,.grid4{grid-template-columns:1fr;}}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--border-strong);border-radius:4px;background:#fff;color:var(--ink);font-size:13.5px;margin-bottom:11px;font:inherit;}
input:disabled{background:#f3f4f6;color:#555;}
input:focus,select:focus,textarea:focus{outline:2px solid #9db8cc;border-color:var(--navy);}
textarea{resize:vertical;min-height:56px;}
fieldset{border:none;padding:0;margin:0 0 4px;}
legend{font-size:12.5px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);width:100%;}
.btn{display:inline-block;background:var(--navy);color:#fff;border:1px solid var(--navy);padding:8px 14px;border-radius:4px;font-size:13px;cursor:pointer;font:inherit;}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--border-strong);}
.btn.danger{background:#fff;color:var(--red);border-color:#e2b6b2;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);border-bottom:1px solid var(--border);padding:7px 8px;font-weight:600;}
td{padding:8px 8px;border-bottom:1px solid var(--border);}
tr.click{cursor:pointer;}
tr.click:hover{background:#f7f9fb;}
.num{text-align:right;font-family:ui-monospace,monospace;}
.badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:3px;font-weight:600;letter-spacing:.02em;}
.badge.draft{background:#eef0f2;color:#565f6b;}
.badge.submitted,.badge.under_review{background:var(--amberbg);color:var(--amber);}
.badge.approved,.badge.ready_for_disbursement,.badge.active{background:var(--greenbg);color:var(--green);}
.badge.rejected{background:var(--redbg);color:var(--red);}
.badge.disbursed,.badge.completed{background:#eaeef5;color:var(--navy);}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px;}
.kpi .n{font-size:22px;font-weight:700;font-family:ui-monospace,monospace;}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:2px;}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tabs button{background:none;border:none;padding:9px 13px;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font:inherit;}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600;}
.empty{text-align:center;color:var(--muted);padding:46px 10px;font-size:13.5px;border:1px dashed var(--border);border-radius:6px;}
.help{font-size:11.5px;color:var(--muted);margin:-7px 0 11px;}
.err{font-size:11.5px;color:var(--red);margin:-7px 0 11px;}
.calc{background:#f9fafb;border:1px solid var(--border);border-radius:4px;padding:10px 12px;font-size:12.5px;}
.calc .ln{display:flex;justify-content:space-between;padding:2px 0;}
.calc .ln.total{border-top:1px solid var(--border-strong);margin-top:4px;padding-top:6px;font-weight:600;}
.toast{position:fixed;bottom:20px;right:20px;background:#1f2530;color:#fff;padding:9px 16px;border-radius:5px;font-size:12.5px;z-index:99;opacity:0;transition:opacity .2s;}
.toast.show{opacity:1;}
.act{font-size:12px;color:var(--muted);border-left:2px solid var(--border);padding-left:10px;margin-bottom:6px;}
.stack{display:flex;flex-direction:column;gap:2px;}
.locked{font-size:11px;color:var(--muted);}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="logo" id="brandBar">NORTHFIELD <span>Capital Finance — Loan Management</span></div>
    <div class="who" id="whoBar"></div>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<div class="toast" id="toast"></div>

<script>
/* ---------- Calculation engine: mirrors the Disbursement Form / Loan Schedule workbook ---------- */
const LoanCalculator = (() => {
  const r2 = n => Math.round((Number(n)||0) * 100 + Number.EPSILON) / 100;
  const calculateEstablishmentFee = (amount, rates) => r2(amount * rates.establishmentFeePct);
  const calculateApplicationFee = (amount, rates) => r2(rates.applicationFeeFlat);
  const calculateInsuranceFee = (amount, rates) => r2(amount * rates.insuranceFeePct);
  const calculateBankCharges = (amount, rates) => r2(rates.bankChargeFlat);
  const calculateTotalFees = f => r2(f.establishmentFee + f.applicationFee + f.insuranceFee + f.bankCharges);
  const calculateIMTT = (netBeforeImtt, rates) => r2(Math.max(0, netBeforeImtt) * rates.imttPct);
  const calculateNetLoan = (amount, totalFees, imtt) => {
    const netBeforeImtt = r2(amount - totalFees);
    return { netBeforeImtt, net: r2(netBeforeImtt - imtt) };
  };
  const calculateLiquidation = app => r2(app.liquidation || 0);
  const calculateMonthlyInterest = (amount, rates) => r2(amount * rates.monthlyFlatRatePct);
  const calculateMonthlyPrincipal = (principal, tenure) => r2(principal / tenure);
  const calculateTotalInterest = (monthlyInterest, tenure) => r2(monthlyInterest * tenure);
  const calculateTotalRepayment = (principal, totalInterest) => r2(principal + totalInterest);
  const calculateMonthlyInstalment = (totalRepayment, tenure) => r2(totalRepayment / tenure);

  function charges(amount, liquidation, rates){
    const establishmentFee = calculateEstablishmentFee(amount, rates);
    const applicationFee = calculateApplicationFee(amount, rates);
    const insuranceFee = calculateInsuranceFee(amount, rates);
    const bankCharges = calculateBankCharges(amount, rates);
    const totalFees = calculateTotalFees({establishmentFee, applicationFee, insuranceFee, bankCharges});
    const { netBeforeImtt, net } = calculateNetLoan(amount, totalFees, calculateIMTT(r2(amount-totalFees), rates));
    const imtt = calculateIMTT(r2(amount - totalFees), rates);
    const liq = calculateLiquidation({liquidation});
    const netAfterLiquidation = r2(net - liq);
    return { establishmentFee, applicationFee, insuranceFee, bankCharges, totalFees, netBeforeImtt, imtt, net, liquidation: liq, netAfterLiquidation };
  }

  function loanTerms(amount, tenure, rates){
    const monthlyInterest = calculateMonthlyInterest(amount, rates);
    const monthlyPrincipal = calculateMonthlyPrincipal(amount, tenure);
    const totalInterest = calculateTotalInterest(monthlyInterest, tenure);
    const totalRepayment = calculateTotalRepayment(amount, totalInterest);
    const instalment = calculateMonthlyInstalment(totalRepayment, tenure);
    return { monthlyInterest, monthlyPrincipal, totalInterest, totalRepayment, instalment };
  }

  function generateRepaymentSchedule(amount, tenure, monthlyInterest, monthlyPrincipal, startDate, extraPayments){
    extraPayments = extraPayments || {};
    const rows = []; let bal = amount; let cum = 0;
    const start = startDate ? new Date(startDate) : new Date();
    for(let i=1;i<=tenure;i++){
      if(bal<=0) break;
      const principal = i===tenure ? r2(bal) : Math.min(monthlyPrincipal, r2(bal));
      const interest = monthlyInterest;
      const extra = r2(extraPayments[i] || 0);
      const begin = r2(bal);
      bal = r2(Math.max(0, bal - principal - extra));
      cum = r2(cum + interest);
      const d = new Date(start); d.setMonth(d.getMonth() + i);
      rows.push({ n:i, date:d.toISOString().slice(0,10), begin, scheduled:r2(principal+interest), extra, principal, interest, end:bal, cum });
    }
    return rows;
  }
  return { r2, calculateEstablishmentFee, calculateApplicationFee, calculateInsuranceFee, calculateBankCharges,
    calculateTotalFees, calculateIMTT, calculateNetLoan, calculateLiquidation, calculateMonthlyInterest,
    calculateMonthlyPrincipal, calculateMonthlyInstalment, calculateTotalInterest, calculateTotalRepayment,
    generateRepaymentSchedule, charges, loanTerms };
})();

const Validation = {
  application(a, rates){
    const e = [];
    if(!a.customerName) e.push("Please enter the applicant's name.");
    if(!a.idNumber) e.push("Please enter an ID or EC number.");
    if(!a.employer) e.push("Please enter the applicant's employer.");
    if(!(a.amountApplied > 0)) e.push("Please enter a valid loan amount.");
    if(a.amountApplied > rates.maxAmount) e.push(`Loan amount cannot exceed ${Format.money(rates.maxAmount)}.`);
    if(a.approvedAmount != null && a.approvedAmount > a.amountApplied) e.push("Approved amount cannot exceed the amount applied for.");
    if(!(a.tenureMonths >= 1) || a.tenureMonths > rates.maxTenureMonths) e.push(`Tenure must be between 1 and ${rates.maxTenureMonths} months.`);
    if(!a.startDate) e.push("Please select a loan start date.");
    if(a.liquidation < 0) e.push("Liquidation amount cannot be negative.");
    return e;
  }
};

const Format = {
  money(n){
    const sym = CURRENCY_SYMBOL[config().currencyCode] || (config().currencyCode + " ");
    return sym + (LoanCalculator.r2(n)).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  },
  date(iso){
    if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return "—";
    if(config().dateFormat === "MM/DD/YYYY") return d.toLocaleDateString("en-US",{year:"numeric",month:"2-digit",day:"2-digit"});
    if(config().dateFormat === "YYYY-MM-DD") return d.toISOString().slice(0,10);
    return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"2-digit"});
  },
  dt(iso){ const d=new Date(iso); return Format.date(iso) + " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); }
};

const STATUS_LABEL = {draft:"Draft",submitted:"Submitted",under_review:"Under Review",approved:"Approved",
  rejected:"Rejected",ready_for_disbursement:"Ready for Disbursement",disbursed:"Disbursed",active:"Active",completed:"Completed"};

/* Configuration model: the single source of truth for defaults. This is what a fresh installation
   ships with before an administrator has saved anything — never written to the UI as if it were
   confirmed system settings, only used to keep the calculator and forms functional while
   settings/config has not been created yet (see SETTINGS_STATUS.empty below). */
const DEFAULT_CONFIG = {
  defaultTenureMonths:6, minAmount:50, maxAmount:5000, monthlyFlatRatePct:0.05, maxTenureMonths:24,
  repaymentFrequency:"monthly", requiredApprovals:1,
  establishmentFeePct:0.03, applicationFeeFlat:0, insuranceFeePct:0.015, bankChargeFlat:2, imttPct:0.02,
  companyName:"Northfield Capital Finance (Pvt) Ltd", companyPhone:"", companyEmail:"", companyAddress:"", referencePrefix:"NCF",
  currencyCode:"USD", dateFormat:"DD MMM YYYY", numberFormat:"comma", defaultPageSize:25
};
const CURRENCY_SYMBOL = {USD:"$", ZWG:"ZWG ", ZAR:"R ", GBP:"£", EUR:"€"};

/* ---------- App state & data layer ---------- */
let db=null, userCap=null, me={name:"",id:null,canEdit:false};
let apps=[], customers=[], settings=null, settingsStatus="loading", settingsErrorMsg="";
let route="dashboard", detailId=null, detailTab="overview";
let role = localStorage.getItem('pmf_role') || 'officer';
let settingsEditing = {}; // per-section edit mode
function config(){ return settings || DEFAULT_CONFIG; }
function isAdmin(){ return me.canEdit === true; }

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2200); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function boot(){
  db = await claude.use("db");
  userCap = await claude.use("user");
  if(!db){ document.getElementById('app').innerHTML = '<div class="empty">This system requires the shared data store capability, which is not available in this view.</div>'; return; }
  if(userCap){ try { me = await userCap.me(); } catch(e){ console.error('Failed to resolve viewer identity', e); } }
  subscribeSettings();
  db.collection('applications').orderBy('createdAt','desc').limit(300).onSnapshot(s=>{ apps = s.docs.map(d=>({id:d.id,...d.data()})); render(); },
    err=>{ console.error('applications subscription failed', err); toast('Could not load loan applications. ' + err.message); });
  db.collection('customers').orderBy('createdAt','desc').limit(300).onSnapshot(s=>{ customers = s.docs.map(d=>({id:d.id,...d.data()})); render(); });
  render();
}

/* The System Settings data source. Isolated from the rest of the app's render path so a problem
   here (a rejected subscription, a document that doesn't exist yet) never blocks Dashboard,
   Applications or Customers — only the Settings section shows its own state. */
let unsubSettings = null;
function subscribeSettings(){
  settingsStatus = "loading"; render();
  if(unsubSettings) unsubSettings();
  try{
    unsubSettings = db.doc('settings/config').onSnapshot(snap=>{
      if(snap.exists){
        settings = {...DEFAULT_CONFIG, ...snap.data()};
        settingsStatus = "ready";
      } else {
        settings = null;
        settingsStatus = "empty";
      }
      render();
    }, err=>{
      console.error('settings/config subscription failed', err);
      settingsStatus = "error"; settingsErrorMsg = err.message || "The configuration service did not respond.";
      render();
    });
  } catch(e){
    console.error('Could not open settings subscription', e);
    settingsStatus = "error"; settingsErrorMsg = e.message || "The configuration service is unavailable.";
    render();
  }
}
async function configureSettings(){
  try{
    await db.doc('settings/config').set(DEFAULT_CONFIG);
    toast('System settings created with standard rates.');
  } catch(e){
    console.error('Failed to create initial settings', e);
    toast(e.code === 'invalid_argument' ? "You don't have permission to configure system settings." : 'Could not save system settings.');
  }
}

function setRole(r){ role = r; localStorage.setItem('pmf_role', r); render(); }
function nav(r, id){ route=r; detailId=id||null; detailTab="overview"; render(); }

function render(){
  renderHeader();
  const el = document.getElementById('app');
  const pages = { dashboard:pageDashboard, applications:pageApplications, newapp:pageNewApp, detail:pageDetail,
    customers:pageCustomers, settings:pageSettings };
  el.innerHTML = (pages[route]||pageDashboard)();
  wire();
}

function renderHeader(){
  const name = settingsStatus==='ready' ? config().companyName : "NORTHFIELD";
  document.getElementById('brandBar').innerHTML = settingsStatus==='ready'
    ? `${esc(name)} <span>Loan Management</span>`
    : `NORTHFIELD <span>Capital Finance — Loan Management</span>`;
  document.getElementById('whoBar').innerHTML = `
    <span>${esc(me.name || "Guest")}${isAdmin()?' · Administrator':''}</span>
    <select onchange="setRole(this.value)">
      <option value="officer" ${role==='officer'?'selected':''}>Loan Officer</option>
      <option value="approver" ${role==='approver'?'selected':''}>Approver</option>
    </select>`;
  const items = [["dashboard","Dashboard"],["applications","Loan Applications"],["customers","Customers"],["settings","System Settings"]];
  document.getElementById('tabs').innerHTML = items.map(([k,l])=>`<button class="${route===k||(route==='detail'&&k==='applications')||(route==='newapp'&&k==='applications')?'on':''}" onclick="nav('${k}')">${l}</button>`).join("");
}

function outstandingBalance(a){
  const rows = a.schedule||[]; const today = new Date(); let bal = a.amountApplied;
  for(const r of rows){ if(new Date(r.date) <= today) bal = r.end; else break; }
  return bal;
}

/* ---------- Dashboard ---------- */
function pageDashboard(){
  const active = apps.filter(a=>['approved','ready_for_disbursement','disbursed','active'].includes(a.status));
  const pending = apps.filter(a=>['submitted','under_review'].includes(a.status));
  const approved = apps.filter(a=>a.status==='approved');
  const disbursedApps = apps.filter(a=>['disbursed','active','completed'].includes(a.status));
  const disbursedTotal = disbursedApps.reduce((s,a)=>s + (a.disbursement?.amountPayable || a.charges?.netAfterLiquidation || 0), 0);
  const outstanding = apps.filter(a=>a.status==='active').reduce((s,a)=> s + outstandingBalance(a), 0);
  const collectionsDue = apps.filter(a=>a.status==='active').reduce((s,a)=>{
    const next = (a.schedule||[]).find(r=> new Date(r.date) >= new Date() ) || (a.schedule||[])[0];
    return s + (next ? next.scheduled : 0);
  }, 0);
  const recent = apps.slice(0,6);
  return `<h1>Dashboard</h1><p class="sub">Portfolio position as at ${Format.date(new Date().toISOString())}.</p>
  <div class="grid4" style="margin-bottom:14px">
    <div class="kpi"><div class="n">${active.length}</div><div class="l">Active loans</div></div>
    <div class="kpi"><div class="n">${pending.length}</div><div class="l">Pending applications</div></div>
    <div class="kpi"><div class="n">${approved.length}</div><div class="l">Approved, awaiting disbursement</div></div>
    <div class="kpi"><div class="n">${Format.money(disbursedTotal)}</div><div class="l">Disbursed amount (total)</div></div>
  </div>
  <div class="grid" style="margin-bottom:14px">
    <div class="kpi"><div class="n">${Format.money(outstanding)}</div><div class="l">Outstanding balance</div></div>
    <div class="kpi"><div class="n">${Format.money(collectionsDue)}</div><div class="l">Collections due (next instalment, active loans)</div></div>
  </div>
  <div class="panel"><h2>Recent applications</h2>
  ${recent.length? appTable(recent, false) : `<div class="empty">No applications have been recorded yet.</div>`}
  </div>`;
}

/* ---------- Applications list ---------- */
function pageApplications(){
  return `<div class="row" style="justify-content:space-between;margin-bottom:4px">
    <div><h1>Loan Applications</h1><p class="sub" style="margin-bottom:0">${apps.length} record(s).</p></div>
    <button class="btn" onclick="nav('newapp')">New Application</button>
  </div><div class="panel">${apps.length? appTable(apps, true) : `<div class="empty">No applications yet. Use "New Application" to create one.</div>`}</div>`;
}
function appTable(list, full){
  return `<table><tr><th>Applicant</th><th>Amount Applied</th><th>Tenure</th><th>Status</th><th>Created</th></tr>
  ${list.map(a=>`<tr class="click" onclick="nav('detail','${a.id}')">
    <td>${esc(a.customerName)}</td><td class="num">${Format.money(a.amountApplied)}</td><td class="num">${a.tenureMonths} mo</td>
    <td><span class="badge ${a.status}">${STATUS_LABEL[a.status]}</span></td><td>${Format.date(a.createdAt)}</td></tr>`).join("")}
  </table>`;
}

/* ---------- New application ---------- */
function pageNewApp(){
  return `<h1>New Loan Application</h1><p class="sub">Fields marked calculated are derived automatically and cannot be edited directly.</p>
  <form onsubmit="return false" id="newForm">
  <div class="panel"><fieldset><legend>Applicant Information</legend><div class="grid">
    <div><label>Applicant name</label><input id="f_name"></div>
    <div><label>ID / EC number</label><input id="f_id"></div>
    <div><label>Phone</label><input id="f_phone"></div>
    <div><label>Email</label><input id="f_email"></div>
    <div><label>Employer</label><input id="f_employer"></div>
    <div><label>Net monthly salary</label><input id="f_salary" type="number" min="0"></div>
  </div></fieldset></div>
  <div class="panel"><fieldset><legend>Loan Information</legend><div class="grid">
    <div><label>Loan amount applied for</label><input id="f_amount" type="number" min="1" value="500"></div>
    <div><label>Loan tenure (months)</label><input id="f_tenure" type="number" min="1" value="6"></div>
    <div><label>Loan start date</label><input id="f_start" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div><label>Existing loan settlement (liquidation)</label><input id="f_liq" type="number" min="0" value="0"></div>
  </div></fieldset></div>
  <div class="panel" id="chargesBox"></div>
  <div class="err" id="formErr" style="display:none"></div>
  <div class="row"><button class="btn" onclick="createApplication()">Save as Draft</button><button class="btn ghost" onclick="nav('applications')">Cancel</button></div>
  </form>`;
}
function liveCharges(){
  const amount = +val('f_amount')||0, tenure = +val('f_tenure')||1, liq = +val('f_liq')||0;
  const c = LoanCalculator.charges(amount, liq, config());
  const t = LoanCalculator.loanTerms(amount, tenure, config());
  document.getElementById('chargesBox').innerHTML = `<h2>Charges (calculated)</h2><div class="calc">
    <div class="ln"><span>Establishment fee (${(config().establishmentFeePct*100).toFixed(1)}%)</span><span class="mono">${Format.money(c.establishmentFee)}</span></div>
    <div class="ln"><span>Application fee</span><span class="mono">${Format.money(c.applicationFee)}</span></div>

function val(id){ const e=document.getElementById(id); return e?e.value.trim():""; }
async function createApplication(){
  const amount=+val('f_amount')||0, tenure=+val('f_tenure')||1, liq=+val('f_liq')||0, start=val('f_start');
  const data = { customerName:val('f_name'), idNumber:val('f_id'), phone:val('f_phone'), email:val('f_email'),
    employer:val('f_employer'), salary:+val('f_salary')||0, amountApplied:amount, approvedAmount:amount,
    tenureMonths:tenure, startDate:start, liquidation:liq };
  const errs = Validation.application(data, config());
  const box = document.getElementById('formErr');
  if(errs.length){ box.style.display='block'; box.innerHTML = errs.map(e=>`&bull; ${esc(e)}`).join("<br>"); return; }
  box.style.display='none';
  const charges = LoanCalculator.charges(amount, liq, config());
  const terms = LoanCalculator.loanTerms(amount, tenure, config());
  const schedule = LoanCalculator.generateRepaymentSchedule(amount, tenure, terms.monthlyInterest, terms.monthlyPrincipal, start, {});
  const now = new Date().toISOString();
  const custRef = await db.collection('customers').add({ name:data.customerName, idNumber:data.idNumber, phone:data.phone,
    email:data.email, employer:data.employer, salary:data.salary, createdAt:now });
  await db.collection('applications').add({ ...data, customerId:custRef.id, rates:config(), charges, terms, schedule,
    extraPayments:{}, status:'draft', disbursement:null,
    timeline:[{at:now, by:me.name||'Loan Officer', action:'Application created'}], createdAt:now, updatedAt:now });
  toast('Application saved as draft.');
  nav('applications');
}

function statusActions(a){
  let btn = '';
  if(a.status==='draft') btn = `<button class="btn" onclick="transition('${a.id}','submitted','Submitted for review')">Submit Application</button>`;
  if(a.status==='approved') btn = `<button class="btn" onclick="transition('${a.id}','ready_for_disbursement','Marked ready for disbursement')">Mark Ready for Disbursement</button>`;
  if(a.status==='disbursed') btn = `<button class="btn" onclick="transition('${a.id}','active','Loan activated')">Activate Loan</button>`;
  if(a.status==='active'){ const done=(a.schedule||[]).every(r=>r.end<=0); if(done) btn = `<button class="btn" onclick="transition('${a.id}','completed','Loan marked completed')">Mark Completed</button>`; }
  return btn? `<div class="row">${btn}</div>` : '';
}
async function transition(id, to, note){
  const a = appById(id); const now = new Date().toISOString();
  await db.collection('applications').doc(id).update({ status:to, updatedAt:now, timeline:[...a.timeline,{at:now,by:me.name||role,action:STATUS_LABEL[to],detail:note}] });
  toast(`Status updated to ${STATUS_LABEL[to]}.`);
}
async function approveApp(id){
  if(!confirm('Approve this loan application?')) return;
  const a = appById(id); const now = new Date().toISOString();
  const approvals = (a.timeline||[]).filter(t=>t.action==='Approved').length + 1;
  const timeline = [...a.timeline, {at:now, by:me.name||'Approver', action:'Approved'}];
  if(approvals >= config().requiredApprovals){
    await db.collection('applications').doc(id).update({ status:'approved', updatedAt:now, timeline:[...timeline,{at:now,by:me.name||'Approver',action:'Application Approved',detail:'Approval threshold met'}] });
  } else {
    await db.collection('applications').doc(id).update({ timeline, updatedAt:now });
  }
  toast('Approval recorded.');
}
async function rejectApp(id){
  const reason = prompt('Reason for rejection (required):');
  if(!reason) return;
  const a = appById(id); const now = new Date().toISOString();
  await db.collection('applications').doc(id).update({ status:'rejected', updatedAt:now, timeline:[...a.timeline,{at:now,by:me.name||'Approver',action:'Rejected',detail:reason}] });
  toast('Application rejected.');
}
async function recordDisbursement(id){
  const a = appById(id);
  const disb = { amountPayable:a.charges.netAfterLiquidation, bankName:val('d_bank'), accountName:val('d_accname'),
    accountNumber:val('d_accnum'), reference:val('d_ref'), date:val('d_date'), authorisedBy:val('d_auth') };
  if(!disb.bankName || !disb.accountNumber || !disb.reference){ toast('Please complete the bank, account number and reference fields.'); return; }
  if(!confirm('Confirm disbursement? This cannot be undone from this screen.')) return;
  const now = new Date().toISOString();
  await db.collection('applications').doc(id).update({ status:'disbursed', disbursement:disb, updatedAt:now,
    timeline:[...a.timeline,{at:now,by:me.name||'Approver',action:'Disbursed',detail:`${disb.reference} via ${disb.bankName}`}] });
  toast('Disbursement recorded.');
}

function pageSettings(){

  if(settingsStatus==='error'){

    ['dateFormat','Date format',{select:['DD MMM YYYY','MM/DD/YYYY','YYYY-MM-DD']}],
    ['numberFormat','Number formatting',{select:['comma','plain']}],
    ['defaultPageSize','Default page size','number']
  ])}
  <div class="panel"><h2>User and Security Settings</h2>

function settingsSection(key,title,desc,s,admin,fields,extraHtml){
  const editing = !!settingsEditing[key];
  const rows = fields.map(([id,label,type])=>{
    const inputId = 's_'+key+'_'+id; const value = s[id];
    if(typeof type==='object' && type.select){
      return `<div><label>${label}</label><select id="${inputId}" ${admin&&editing?'':'disabled'}>${type.select.map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join("")}</select></div>`;
    }
    const step = type==='pct' ? '0.001' : (type==='money' ? '0.01' : '1');
    const shown = type==='pct' ? LoanCalculator.r2(value*100) : value;
    return `<div><label>${label}${type==='pct'?' (%)':''}</label><input id="${inputId}" type="${type==='text'?'text':'number'}" step="${step}" value="${esc(shown)}" ${admin&&editing?'':'disabled'}></div>`;
  }).join("");
  const err = document.getElementById?.('') ; // no-op, keeps helper self-contained
  return `<div class="panel"><fieldset><legend>${esc(title)}</legend>
  <p class="help" style="margin-top:-2px">${esc(desc)}</p>
  <div class="grid3">${rows}</div>${extraHtml||""}
  <div class="err" id="err_${key}" style="display:none"></div>
  ${admin? (editing
      ? `<div class="row"><button class="btn" onclick="saveSection('${key}')">Save Changes</button><button class="btn ghost" onclick="cancelEdit('${key}')">Cancel</button></div>`
      : `<button class="btn ghost" onclick="editSection('${key}')">Edit</button>`)
    : ""}
  </fieldset></div>`;
}
function editSection(key){ settingsEditing[key]=true; render(); }
function cancelEdit(key){ settingsEditing[key]=false; render(); }

const SECTION_FIELDS = {
  loan: [['defaultTenureMonths','number'],['minAmount','money'],['maxAmount','money'],['monthlyFlatRatePct','pct'],['maxTenureMonths','number'],['requiredApprovals','number']],
  charges: [['establishmentFeePct','pct'],['applicationFeeFlat','money'],['insuranceFeePct','pct'],['bankChargeFlat','money'],['imttPct','pct']],
  company: [['companyName','text'],['companyPhone','text'],['companyEmail','text'],['companyAddress','text'],['referencePrefix','text']],
  prefs: [['currencyCode','text'],['dateFormat','text'],['numberFormat','text'],['defaultPageSize','number']]
};
async function saveSection(key){
  const errs = []; const patch = {};
  for(const [id,type] of SECTION_FIELDS[key]){
    const el = document.getElementById('s_'+key+'_'+id); if(!el) continue;
    if(type==='text'){ patch[id]=el.value.trim(); if(!patch[id] && ['companyName','currencyCode','dateFormat','numberFormat'].includes(id)) errs.push(`${id==='companyName'?'Company name':'This field'} cannot be empty.`); }
    else if(type==='pct'){ const n=+el.value; if(isNaN(n)||n<0) errs.push('Please enter a valid percentage.'); else patch[id]=LoanCalculator.r2(n)/100; }
    else { const n=+el.value; if(isNaN(n)||n<0) errs.push('Please enter a valid number.'); else patch[id]=n; }
  }
  if(key==='loan' && patch.minAmount!=null && patch.maxAmount!=null && patch.minAmount > patch.maxAmount) errs.push('Minimum loan amount cannot exceed the maximum loan amount.');
  const box = document.getElementById('err_'+key);
  if(errs.length){ box.style.display='block'; box.innerHTML = errs.map(e=>`&bull; ${esc(e)}`).join('<br>'); return; }
  box.style.display='none';
  try{
    await db.doc('settings/config').update(patch);
    settingsEditing[key]=false;
    toast('Settings saved.');
  } catch(e){
    console.error('Failed to save settings section '+key, e);
    box.style.display='block';
    box.innerHTML = e.code==='invalid_argument' ? "You don't have permission to save system settings." : 'Could not save these settings. Please try again.';
  }
}

function wire(){ if(route==='newapp'){ ['f_amount','f_tenure','f_liq'].forEach(id=>{ const e=document.getElementById(id); if(e) e.oninput = liveCharges; }); liveCharges(); } }

boot();
